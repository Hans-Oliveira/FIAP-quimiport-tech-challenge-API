name: QuimiPort CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - develop
  pull_request:
    branches:
      - main
      - dev
      - develop

jobs:
  validate-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quimiport_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/quimiport_db"

      - name: Lint and Code Quality
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Push Prisma Schema to Database
        run: npx prisma db push
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/quimiport_db"

      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/quimiport_db"
