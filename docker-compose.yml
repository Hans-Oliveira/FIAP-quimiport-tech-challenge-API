services:
  db:
    image: mysql:8.0
    container_name: quimiport-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-quimiport}
      MYSQL_USER: ${MYSQL_USER:-quimiport_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quimiport_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u quimiport_user -pquimiport_pass || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - quimiport-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quimiport-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-quimiport_user}:${MYSQL_PASSWORD:-quimiport_pass}@db:3306/${MYSQL_DATABASE:-quimiport}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --skip-generate && npm run start:prod"
    networks:
      - quimiport-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: quimiport-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    networks:
      - quimiport-network

volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  quimiport-network:
    driver: bridge
